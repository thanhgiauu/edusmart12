
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập giáo viên | EduSmart 12</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="admin-shell">

    <div class="admin-top">
        <div class="container">
            <strong>🎓 EduSmart 12</strong>
            <a href="../index.html" style="color:white">
                ← Về trang chủ
            </a>
        </div>
    </div>

    <main class="container" style="padding-top:65px;padding-bottom:65px">

        <div class="card" style="max-width:450px;margin:auto">

            <div style="text-align:center;margin-bottom:25px">
                <div class="big-icon">🔐</div>
                <h1 style="color:#102448">Giáo viên đăng nhập</h1>
                <p class="small">
                    Khu vực quản lý website EduSmart 12
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Tên tài khoản</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Nhập tài khoản"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group" style="margin-top:15px">
                    <label for="password">Mật khẩu</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div style="margin-top:20px">
                    <button
                        type="submit"
                        class="btn btn-primary"
                        style="width:100%">
                        Đăng nhập
                    </button>
                </div>

                <p
                    id="loginMessage"
                    style="color:#dc2626;margin-top:15px"
                    aria-live="polite">
                </p>

            </form>

            <div class="notice" style="margin-top:20px">
                Chỉ dành cho giáo viên được cấp quyền quản trị.
            </div>

        </div>

    </main>

</div>

<script src="../js/auth.js"></script>

</body>
</html>
