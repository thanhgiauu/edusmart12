
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập học sinh - EduSmart 12</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-page">

<header class="auth-header">
    <a href="../index.html" class="auth-brand">🎓 EduSmart 12</a>
    <a href="../index.html" class="auth-home">← Trang chủ</a>
</header>

<main class="auth-container">
    <section class="auth-card">

        <div class="auth-icon">📚</div>

        <h1>Đăng nhập học sinh</h1>

        <p class="auth-description">
            Chào mừng bạn quay lại EduSmart 12!
        </p>

        <form class="auth-form"
              data-auth-form
              data-endpoint="/api/auth/student/login"
              data-redirect="/index.html"
              data-button-text="Đăng nhập">

            <label for="username">Tên đăng nhập</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Nhập tên đăng nhập"
                autocomplete="username"
                required>

            <label for="password">Mật khẩu</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required>

            <button type="submit" class="auth-submit">
                Đăng nhập học sinh
            </button>

            <div id="authMessage" class="auth-message"></div>
        </form>

        <div class="auth-bottom">
            Chưa có tài khoản?
            <a href="dang-ky.html">Đăng ký học sinh</a>
            <br>
            Bạn là giáo viên?
            <a href="../giao-vien/dang-nhap.html">Đăng nhập giáo viên</a>
        </div>

    </section>
</main>

<script src="../js/auth.js"></script>

</body>
</html>
